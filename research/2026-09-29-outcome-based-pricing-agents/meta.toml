status = "complete"
summary = "Outcome pricing is proven only in customer support (Fin, Sierra, Zendesk, HubSpot) plus pre-existing contingency markets (recruiting, revenue-cycle recovery, PI legal), and even there it is a minority choice; Salesforce paid ~9x ARR for Fin vs ~100x for Sierra. Refines the earlier run's hypothesis: 'countability' (cheap, two-party, auditable, low-stakes events) predicts the billing unit, while ML-style verifiability predicts capability and demand — which is why coding leads demand but bills on usage."
