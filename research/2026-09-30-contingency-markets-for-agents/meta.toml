summary = "Ranks five contingency markets for outcome-priced AI agents: CPG retail deduction recovery first, small/mid commercial property tax appeals second, inbound lead intake per booked appointment third, licensed/nursing recruitment via marketplace fourth, and R&D tax credits last as an outcome-priced market (sell flat-fee Section G evidence files instead). Key amendment to the countability framework: fees survive only where a resisting counterparty must be persuaded case by case, not where the payer can self-detect."
