summary = "Coding agents are the only category where VC money and proven user demand clearly agree, though the labs' own agents (Claude Code, Codex) increasingly out-earn independents. VCs pay 50–100x ARR for outcome-priced vertical agents (CX, legal) and metered agent infra while broad enterprise scaling sits near 23%, and consumer agents show real grassroots pull that the labs, not startups, capture."
